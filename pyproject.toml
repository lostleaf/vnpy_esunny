[project]
name = "vnpy_esunny"
version = "9.0.3.16.1"
description = "Esunny gateway for VeighNa quant trading framework."
readme = "README.md"
license = "MIT"
authors = [{name = "Xiaoyou Chen", email = "xiaoyou.chen@mail.vnpy.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: Chinese (Simplified)",
]
requires-python = ">=3.10"
dependencies = ["vnpy>=3.0.0"]
keywords = ["quant", "quantitative", "investment", "trading", "algotrading", "esunny"]

[project.urls]
"Homepage" = "https://www.vnpy.com"
"Documentation" = "https://www.vnpy.com/docs"
"Forum" = "https://www.vnpy.com/forum"

[dependency-groups]
build = [
    "build",
    "mypy",
    "pybind11>=2.13.6",
    "ruff",
    "setuptools>=70",
    "wheel",
]

[build-system]
requires = [
    "setuptools>=70",
    "wheel",
    "pybind11>=2.13.6",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vnpy_esunny", "vnpy_esunny.*"]

[tool.setuptools.package-data]
"vnpy_esunny.api" = ["*.so"]

[tool.uv]
default-groups = ["build"]

[tool.ruff]
target-version = "py310"
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
